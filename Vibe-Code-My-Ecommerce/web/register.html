<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - SnapPlay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">SnapPlay</a>
    <div class="nav-links">
      <a href="photographers.html">ช่างภาพ</a>
      <a href="streamers.html">สตรีมเมอร์</a>
      <a href="lenses.html">เช่าเลนส์</a>
      <a href="login.html">เข้าสู่ระบบ</a>
      <a href="register.html">สมัครสมาชิก</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-page">
      <h2>สมัครสมาชิก</h2>
      <div id="errorMsg" class="error"></div>
      <div id="successMsg" class="success"></div>
      <form id="registerForm">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้" required>
        <input type="email" id="email" placeholder="อีเมล" required>
        <input type="password" id="password" placeholder="รหัสผ่าน" required>
        <input type="text" id="first_name" placeholder="ชื่อ">
        <input type="text" id="last_name" placeholder="นามสกุล">
        <input type="text" id="phone" placeholder="เบอร์โทรศัพท์">
        <button type="submit">สมัครสมาชิก</button>
      </form>
      <p style="text-align:center;margin-top:1rem;">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = Auth.register(username, email, password);
      if (result.success) {
        document.getElementById('successMsg').textContent = 'สมัครสมาชิกสำเร็จ! สามารถเข้าสู่ระบบได้เลย';
        document.getElementById('registerForm').reset();
      } else {
        document.getElementById('errorMsg').textContent = result.message;
      }
    });
  </script>
</body>
</html>
